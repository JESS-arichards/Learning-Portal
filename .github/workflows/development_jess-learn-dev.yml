# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - jess-learn-dev

on:
  push:
    branches:
      - 'development'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist/
            node_modules/
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_25C3AC11EEB5469BAAFAF5B62362643D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_28357B24212E41D194A619C20041224F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CFE0BAD08B7E4386ADDDD77C9E71A10F }}

      - name: Configure development serverless mode and liveness
        shell: bash
        run: |
          set -euo pipefail
          app_name='jess-learn-dev'
          resource_group="$(az webapp list --query "[?name=='${app_name}'].resourceGroup" --output tsv)"
          if [[ -z "$resource_group" || "$resource_group" == *$'\n'* ]]; then
            echo "::error::Cannot uniquely find resource group for ${app_name}."
            exit 1
          fi
          az webapp config appsettings set --resource-group "$resource_group" --name "$app_name" --settings SQL_SERVERLESS_ENABLED=true --output none
          az webapp config set --resource-group "$resource_group" --name "$app_name" --generic-configurations '{"healthCheckPath":"/api/live"}' --output none
          hostname="$(az webapp show --resource-group "$resource_group" --name "$app_name" --query defaultHostName --output tsv)"
          if [[ -z "$hostname" || "$hostname" == "null" || "$hostname" == *$'\n'* ]]; then
            echo "::error::Cannot find development webapp hostname."
            exit 1
          fi
          echo "LEARNING_DEV_URL=https://${hostname}" >> "$GITHUB_ENV"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jess-learn-dev'
          slot-name: 'Production'
          package: .

      - name: Verify development liveness and deep readiness
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --retry 24 --retry-delay 10 --retry-max-time 300 --retry-all-errors --output /dev/null "${LEARNING_DEV_URL}/api/live"
          # Deliberately wake SQL once per deployment; do not schedule this deep probe.
          curl --fail --silent --show-error --connect-timeout 10 --max-time 100 --retry 24 --retry-delay 10 --retry-max-time 300 --retry-all-errors --output /dev/null "${LEARNING_DEV_URL}/api/health"
